# Static checks. This workflow holds no cloud credentials and runs no plans.
# Applies happen on the operator workstation from a saved plan.
#
# The same pins as the platform repository's checks workflow. The only action
# used is pinned by commit. The scanners and linters run as container images
# pinned by digest, or, for Terraform and gitleaks, from release archives
# checked against a pinned SHA-256. No third-party action runs here.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.0"
  TERRAFORM_SHA256: c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67
  # Checkov 3.3.30
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
  # Trivy 0.76.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # gitleaks, the release's linux_x64 archive. Its SHA-256 matches the
  # release's checksums file and GitHub's digest of the asset. The binary is
  # static and runs the runner's git. The image ran its own git, linked to an
  # affected musl (platform repository issue 155).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # ShellCheck 0.11.0
  SHELLCHECK_IMAGE: koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  # Ruff 0.17.2, the platform repository's pin
  RUFF_IMAGE: ghcr.io/astral-sh/ruff@sha256:d69a8c8d529a866a6aaea0dfda672693d68671a08827db765514abc1571a78a0

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Format
        run: terraform fmt -check -recursive infra

      # init fetches the shared module from the platform repository at the
      # pinned commit. The repository is public, so it needs no credential.
      - name: Validate
        run: |
          terraform -chdir=infra/targets init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/targets validate

  # The rules are arguments to the shared module, so the scanners have to fetch
  # the module to see them. Without the module, this root holds one data
  # source and nothing to scan, and both scanners pass.
  checkov:
    name: Checkov
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checkov writes the module next to the code, so it scans a copy. A
      # failed download is only a warning to Checkov, and the scan then passes
      # on the data source alone. The last step fails the job instead.
      - name: Scan Terraform
        run: |
          cp -r infra "${RUNNER_TEMP}/infra"
          docker run --rm --volume "${RUNNER_TEMP}/infra:/src/infra" "${CHECKOV_IMAGE}" \
            --directory /src/infra --framework terraform \
            --download-external-modules true \
            --skip-download --quiet --compact

      - name: Fail if the module was not scanned
        run: >
          find "${RUNNER_TEMP}/infra/.external_modules"
          -path '*/infra/modules/network/main.tf' | grep -q .

  trivy:
    name: Trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" terraform -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # Trivy reads modules that terraform init has fetched, so init runs
      # first, in a copy. The test fails the job if the module is not there.
      - name: Fetch the module
        run: |
          cp -r infra "${RUNNER_TEMP}/infra"
          terraform -chdir="${RUNNER_TEMP}/infra/targets" init -backend=false -input=false -lockfile=readonly
          test -f "${RUNNER_TEMP}/infra/targets/.terraform/modules/network/infra/modules/network/main.tf"

      # The checks built into the pinned image are used as they are. Without
      # --skip-check-update, a newer bundle is downloaded on every run.
      # init clones the whole platform repository, whose manifests and
      # Dockerfile are judged by the platform's own pipeline. Here only
      # Terraform is scanned.
      - name: Scan Terraform
        run: >
          docker run --rm --volume "${RUNNER_TEMP}/infra:/src/infra:ro" "${TRIVY_IMAGE}"
          config --skip-check-update --misconfig-scanners terraform --exit-code 1 /src/infra

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p bin
          tar -xzf "${tarball}" -C bin gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # When git fails, gitleaks logs the error, scans no commits, reports no
      # leaks, and exits 0. So an error in its log, or no commit scanned, fails
      # the step as well.
      - name: Scan the history
        run: |
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          gitleaks git . --redact --no-banner --no-color 2> "${log}" || status=$?
          cat "${log}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -q ' ERR ' "${log}"; then
            echo "::error::gitleaks logged an error"
            exit 1
          fi
          if ! grep -Eq ' INF [1-9][0-9]* commits scanned' "${log}"; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The signature check's script, and the target VMs' first-boot script,
      # update command, and NetBox's install and token scripts, which run as
      # root. The image has no shell, so the runner finds the files.
      - name: Lint the pipeline and host scripts
        run: |
          mapfile -t scripts < <({ find .github/scripts netbox -name '*.sh'; find host -type f; } | sort)
          [ "${#scripts[@]}" -ge 5 ]
          docker run --rm --volume "${PWD}:/mnt:ro" --workdir /mnt "${SHELLCHECK_IMAGE}" \
            "${scripts[@]}"

  # NetBox's seed script runs as root on the orchestrator, and the other two
  # Python files are NetBox's settings. ruff.toml sets the rules.
  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Python files
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          check --no-cache netbox

      - name: Check the formatting
        run: >
          docker run --rm --volume "${PWD}:/io:ro" --workdir /io "${RUFF_IMAGE}"
          format --no-cache --check netbox

      # The seed and the contract are read by Python's json module, on the
      # orchestrator and the lab VM. A file it cannot parse fails here first.
      - name: Parse the JSON files
        run: |
          mapfile -t files < <(find netbox -name '*.json' | sort)
          [ "${#files[@]}" -ge 2 ]
          for f in "${files[@]}"; do python3 -I -m json.tool "${f}" > /dev/null; done

  # Podman's Quadlet generator turns NetBox's .container files into systemd
  # units on the VM. Its dry run is the parser the VM uses, so it is the
  # linter. The runner image's Podman is the one Ubuntu ships, 5.7.0 as on the
  # NetBox VM, and is not pinned here: the runner image sets it, and the job
  # prints it.
  quadlet:
    name: Quadlet units
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The units get a placeholder image ID, as install-netbox.sh writes the
      # real one. A unit with a key Quadlet does not know has to fail the dry
      # run, or the dry run proves nothing about the others.
      - name: Generate the units
        run: |
          podman --version
          units="${RUNNER_TEMP}/units"
          broken="${RUNNER_TEMP}/broken"
          mkdir -p "${units}" "${broken}"
          id=$(printf '0%.0s' $(seq 1 64))
          for unit in netbox/*.container; do
            sed "s/@NETBOX_IMAGE_ID@/${id}/" "${unit}" > "${units}/${unit##*/}"
          done
          [ "$(find "${units}" -name '*.container' | wc -l)" -ge 2 ]
          QUADLET_UNIT_DIRS="${units}" /usr/libexec/podman/quadlet -dryrun > "${RUNNER_TEMP}/generated"
          grep -c '^ExecStart=/usr/bin/podman run ' "${RUNNER_TEMP}/generated" |
            grep -qx "$(find "${units}" -name '*.container' | wc -l)"
          cp "${units}/netbox.container" "${broken}/"
          sed -i 's/^\[Container\]$/[Container]\nNotAQuadletKey=1/' "${broken}/netbox.container"
          if QUADLET_UNIT_DIRS="${broken}" /usr/libexec/podman/quadlet -dryrun > /dev/null 2>&1; then
            echo "::error::Quadlet's dry run passed a unit with an unknown key"
            exit 1
          fi
